# Handloom hub (still named handloom in the code). Works with plain
# `docker compose up -d` and as a Dokploy "Compose" application.
#
# Behind a proxy (Dokploy/Traefik, Caddy, nginx): set the domain and the
# container port 7420 in the proxy, and leave HANDLOOM_PUBLISH as is.
# Without a proxy on a private network: HANDLOOM_PUBLISH=0.0.0.0 (handloom speaks
# plain HTTP; do not expose that to the internet).
services:
  handloom:
    build: .
    image: handloom-hub:${HANDLOOM_TAG:-local}
    restart: unless-stopped
    environment:
      HANDLOOM_BASE_URL: ${HANDLOOM_BASE_URL:-}
      HANDLOOM_NTFY_URL: ${HANDLOOM_NTFY_URL:-}
      HANDLOOM_NTFY_TOPIC: ${HANDLOOM_NTFY_TOPIC:-}
      HANDLOOM_NTFY_TOKEN: ${HANDLOOM_NTFY_TOKEN:-}
      HANDLOOM_WEBHOOK_URL: ${HANDLOOM_WEBHOOK_URL:-}
      HANDLOOM_INSECURE: ${HANDLOOM_INSECURE:-}
      HANDLOOM_TRUST_PROXY: ${HANDLOOM_TRUST_PROXY:-}
    volumes:
      - handloom-data:/data
    ports:
      - "${HANDLOOM_PUBLISH:-127.0.0.1}:${HANDLOOM_PORT:-7420}:7420"

volumes:
  handloom-data:
