{{define "content"}}
<div class="card"><div class="cc">
  <div><h1>Welcome, {{.Name}}</h1><p class="desc">Choose a password for your Handloom account. This link works once.</p></div>
  <form method="post" class="stack">
    <label>Password <input type="password" name="password" autocomplete="new-password" required minlength="12"></label>
    <label>Password again <input type="password" name="password2" autocomplete="new-password" required minlength="12"></label>
    <button type="submit">Set password and sign in</button>
  </form>
</div></div>
{{end}}
