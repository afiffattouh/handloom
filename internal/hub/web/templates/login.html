{{define "content"}}
<div class="card"><div class="cc">
  <div><h1>Sign in</h1><p class="desc">Use the name and password of your Handloom account.</p></div>
  <form method="post" action="/login" class="stack">
    <label>Name <input name="name" value="{{.Name}}" autocomplete="username" required maxlength="64"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</div></div>
{{end}}
